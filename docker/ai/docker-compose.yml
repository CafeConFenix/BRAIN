services:
  ollama:
    image: ollama/ollama:latest
    container_name: brain-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: brain-webui
    restart: unless-stopped

    ports:
      - "3000:8080"

    volumes:
      - openwebui_data:/app/backend/data

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    depends_on:
      - ollama

volumes:
  ollama_data:
  openwebui_data:
